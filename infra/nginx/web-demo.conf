# Same-origin web for the Python twin.
# Browser stays on http://localhost:8088 (Keycloak redirect URIs).
# /api and /health go to the Python contracts-api container, not Nest :3000.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://contractflow-py-contracts-api:3010/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 20m;
  }

  location /health/ready {
    proxy_pass http://contractflow-py-contracts-api:3010/health/ready;
  }

  location /health {
    proxy_pass http://contractflow-py-contracts-api:3010/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
