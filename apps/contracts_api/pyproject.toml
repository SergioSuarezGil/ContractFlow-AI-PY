[project]
name = "contractflow-contracts-api"
version = "0.1.0"
description = "ContractFlow contracts HTTP API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "python-multipart>=0.0.20",
  "PyJWT[crypto]>=2.10.0",
  "httpx>=0.28.0",
  "motor>=3.6.0",
  "aio-pika>=9.5.0",
  "prometheus-client>=0.21.0",
  "contractflow-shared",
  "contractflow-contracts",
  "contractflow-observability",
  "contractflow-grpc",
]

[project.scripts]
contracts-api = "contracts_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
contractflow-shared = { workspace = true }
contractflow-contracts = { workspace = true }
contractflow-observability = { workspace = true }
contractflow-grpc = { workspace = true }
