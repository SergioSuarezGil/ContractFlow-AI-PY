[project]
name = "contractflow-ai-worker"
version = "0.1.0"
description = "ContractFlow AI comparison worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "aio-pika>=9.5.0",
  "httpx>=0.28.0",
  "pypdf>=5.1.0",
  "pydantic>=2.10.0",
  "langchain-core>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "motor>=3.6.0",
  "prometheus-client>=0.21.0",
  "contractflow-shared",
  "contractflow-contracts",
  "contractflow-observability",
  "contractflow-grpc",
]

[project.scripts]
ai-worker = "ai_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
contractflow-shared = { workspace = true }
contractflow-contracts = { workspace = true }
contractflow-observability = { workspace = true }
contractflow-grpc = { workspace = true }
