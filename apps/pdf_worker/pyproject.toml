[project]
name = "contractflow-pdf-worker"
version = "0.1.0"
description = "ContractFlow PDF report worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "aio-pika>=9.5.0",
  "httpx>=0.28.0",
  "fpdf2>=2.8.0",
  "prometheus-client>=0.21.0",
  "contractflow-shared",
  "contractflow-contracts",
  "contractflow-observability",
]

[project.scripts]
pdf-worker = "pdf_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
contractflow-shared = { workspace = true }
contractflow-contracts = { workspace = true }
contractflow-observability = { workspace = true }
