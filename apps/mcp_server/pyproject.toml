[project]
name = "contractflow-mcp-server"
version = "0.1.0"
description = "MCP stdio server: compare_contracts and get_comparison_job"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.9.0,<2",
  "httpx>=0.28.0",
]

[project.scripts]
mcp-server = "mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
