[project]
name = "contractflow-shared"
version = "0.1.0"
description = "Shared settings and utilities for ContractFlow Python apps"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.7.0",
  "aiobotocore>=2.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractflow_shared"]
