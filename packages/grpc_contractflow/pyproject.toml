[project]
name = "contractflow-grpc"
version = "0.1.0"
description = "Generated gRPC stubs for contractflow.v1 (WorkerHealth, ComparisonLookup)"
requires-python = ">=3.12"
dependencies = [
  "grpcio>=1.85.1",
  "protobuf>=5.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractflow_grpc"]
