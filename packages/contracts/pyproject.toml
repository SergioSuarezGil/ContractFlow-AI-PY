[project]
name = "contractflow-contracts"
version = "0.1.0"
description = "Shared OpenAPI and event schema contracts (populated in task 2)"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23.0",
  "referencing>=0.36.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractflow_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "contractflow_contracts/schemas"
