[project]
name = "contractflow-observability"
version = "0.1.0"
description = "JSON logs, build info, and Prometheus helpers for ContractFlow Python apps"
requires-python = ">=3.12"
dependencies = [
  "prometheus-client>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractflow_observability"]
